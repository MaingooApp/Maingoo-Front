<div class="layout-wrapper flex flex-col h-screen overflow-hidden" [ngClass]="containerClass">
  <!-- ═══════ CONTENEDOR 1: TOPBAR (Rojo) ═══════ -->
  <div class="hidden md:block flex-none">
    <app-topbar></app-topbar>
  </div>

  @if (canReadBilling) {
  <app-subscription-alert-banner></app-subscription-alert-banner>
  }

  <!-- ═══════ CONTENEDOR 2: MAIN + SIDEBAR (Azul) ═══════ -->
  <div
    class="md:block flex-auto overflow-hidden relative px-4"
    [class.hidden]="canUseAgent"
    [class.block]="!canUseAgent">
    <app-sidebar></app-sidebar>

    <app-main [containerClass]="mainContainerClass">
      <router-outlet></router-outlet>
    </app-main>
  </div>

  <!-- Fase 1 mobile: experiencia centrada solo en chat. -->
  @if (canUseAgent) {
  <app-mobile-bottom-sheet></app-mobile-bottom-sheet>
  }

  <div class="hidden md:block layout-mask animate-fadein"></div>
</div>
