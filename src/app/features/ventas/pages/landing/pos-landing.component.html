<section class="mx-auto flex min-w-0 w-full max-w-6xl flex-col gap-6 overflow-x-hidden p-4 md:p-6">
  <header class="space-y-2">
    <h1 class="m-0 text-3xl font-bold mg-text">{{ 'pos.landing.title' | translate }}</h1>
    <p class="m-0 mg-text-muted">{{ 'pos.landing.description' | translate }}</p>
  </header>

  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (card of cards; track card.route) {
      @if (canAccess(card.permission)) {
        <a
          [routerLink]="card.route"
          class="flex min-h-36 items-start gap-4 rounded-2xl border border-surface-200 bg-surface-0 p-5 no-underline transition hover:-translate-y-0.5 hover:shadow-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-surface-700 dark:bg-surface-800">
          <span
            class="flex size-12 shrink-0 items-center justify-center rounded-xl bg-primary-50 text-primary dark:bg-primary-900/30">
            <app-icon [name]="card.icon" size="md"></app-icon>
          </span>
          <span class="space-y-1">
            <strong class="block text-lg mg-text">{{ card.labelKey | translate }}</strong>
            <span class="block text-sm leading-6 mg-text-muted">{{ card.descriptionKey | translate }}</span>
          </span>
        </a>
      }
    }
  </div>
</section>
