@if (validating()) {
  <div class="flex min-h-[calc(100vh-10rem)] items-center justify-center" role="status">
    <span
      class="pi pi-spin pi-spinner text-3xl text-primary"
      [attr.aria-label]="'device.terminal.validating' | translate"></span>
  </div>
} @else if (contextError()) {
  <div class="flex min-h-[calc(100vh-10rem)] items-center justify-center p-6 text-center">
    <div>
      <p class="mg-text">{{ 'device.terminal.validationError' | translate }}</p>
      <button type="button" class="min-h-11 rounded-lg bg-primary px-5 text-primary-contrast" (click)="validate()">
        {{ 'device.terminal.retry' | translate }}
      </button>
    </div>
  </div>
} @else if (session.hasActiveOperator()) {
  @if (sessionNoticeCode() === 'EMPLOYEE_SESSION_EXPIRED_OFFLINE') {
    <div
      class="mx-4 mb-3 rounded-lg border border-amber-300 bg-amber-50 p-3 text-amber-950"
      role="status"
      aria-live="polite">
      {{ 'device.terminal.operatorExpiredOffline' | translate }}
    </div>
  }
  <router-outlet />
} @else {
  <app-terminal-pin />
}
